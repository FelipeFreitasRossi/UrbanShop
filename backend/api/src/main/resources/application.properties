# =============================================================================
# UrbanShop API — configuração
# Segredos (senha do banco, chaves) NÃO ficam aqui: vêm do arquivo .env
# (na pasta backend/api, ignorado pelo Git) ou de variáveis de ambiente.
# =============================================================================
spring.application.name=urbanshop-api
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
# Nunca envia detalhes internos de erro para o cliente.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------------- MongoDB Atlas ----------------
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:urbanshop}
# Nomes antigos das mesmas propriedades (mantidos por compatibilidade).
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:urbanshop}
# Os índices (e-mail único, CPF único, etc.) são criados pela classe MongoIndexes,
# que reaproveita índices já existentes em vez de travar a API.
spring.data.mongodb.auto-index-creation=false

# ---------------- Segurança ----------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=2h
app.jwt.issuer=urbanshop-api
# Chave usada para criptografar dados pessoais sensíveis (CPF).
app.security.data-key=${DATA_ENCRYPTION_KEY}

# Endereços usados nos links dos e-mails.
app.frontend-url=${FRONTEND_URL:http://localhost:8081}
app.api-url=${API_URL:http://localhost:8080}

# Sites que podem chamar a API pelo navegador (CORS).
# Em produção: CORS_ALLOWED_ORIGINS=https://urbanshop.com,https://www.urbanshop.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*.*:[*]}

# ---------------- E-mail ----------------
# Sem MAIL_HOST configurado, os links de confirmação aparecem no console (modo desenvolvimento).
app.mail.from=${MAIL_FROM:UrbanShop <no-reply@urbanshop.com>}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------- Monitoramento ----------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
